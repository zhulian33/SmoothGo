name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner:
    name: Planner tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/planner.test.js

  server:
    name: Server tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest tests.test_server
        env:
          SMS_PROVIDER: mock
          OTP_SECRET: ci-secret-not-for-production
          DEV_SHOW_CODE: '0'
